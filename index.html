<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Đánh giá tổ trưởng MTCC</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b7a5a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MTCC">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f3f5f7;--card:#fff;--tx:#1c2630;--mu:#6a7684;--bd:#e1e6eb;--pri:#0b7a5a;--pri2:#e5f4ee;--red:#c62828;--red2:#fdeceb;--amb:#a96400;--amb2:#fff3df;--blu:#1f5fbf;--blu2:#e8f0fc;--pur:#6a3fb5;--pur2:#f0eafb}
@media (prefers-color-scheme:dark){:root{--bg:#11161b;--card:#1a2128;--tx:#e6ebf0;--mu:#93a0ad;--bd:#2a333c;--pri:#34b98c;--pri2:#163128;--red:#ff6b6b;--red2:#3a1e1e;--amb:#f0a93b;--amb2:#3a2d17;--blu:#79a8ff;--blu2:#1b2a44;--pur:#b79bff;--pur2:#2a2140}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 -apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;padding-top:max(10px,env(safe-area-inset-top));z-index:6;background:var(--pri);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:8px}
header b{flex:1;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:7px 11px;font-size:14px}
.tabs{display:none}
.tabs button{flex:1;min-width:64px;border:0;background:none;padding:11px 6px;font-size:14px;color:var(--mu);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--pri);border-bottom-color:var(--pri);font-weight:600}
main{max-width:760px;margin:0 auto;padding:10px 10px calc(84px + env(safe-area-inset-bottom))}
nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.bot button{flex:1;border:0;background:none;padding:7px 2px 6px;color:var(--mu);font-size:11px;position:relative}
nav.bot button i{display:block;font-style:normal;font-size:21px;line-height:1.2;filter:grayscale(1);opacity:.7}
nav.bot button.on{color:var(--pri);font-weight:600}nav.bot button.on i{filter:none;opacity:1}
nav.bot .bd{position:absolute;top:3px;left:50%;margin-left:6px;background:var(--red);color:#fff;border-radius:9px;font-size:10px;padding:0 5px;min-width:16px;line-height:16px}
.sync{font-size:12px;opacity:.85;white-space:nowrap}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;text-align:left;color:var(--tx)}
.tile b{display:block;font-size:26px;line-height:1.2}.tile span{font-size:13px;color:var(--mu)}
.tile.on{outline:2px solid var(--pri)}
.ttl{font-weight:600;font-size:16px;margin:4px 0 2px;cursor:pointer}
.han{font-size:14px;font-weight:600}.han.r{color:var(--red)}.han.a{color:var(--amb)}.han.b{color:var(--blu)}.han.g{color:var(--pri)}
.more{flex:0 0 46px!important;min-width:0!important;font-size:20px!important;padding:8px 0!important}
.menu .btn{display:block;width:100%;text-align:left;margin:6px 0;min-width:0}
.nvbox{background:var(--pur2);border-radius:10px;padding:8px 10px;margin-top:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;flex-wrap:nowrap}
.chips.wrap{flex-wrap:wrap}
.chips.wrap .chip{white-space:normal;text-align:left}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:16px;padding:6px 12px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.03em;color:var(--mu);margin:16px 4px 6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:11px 12px;margin-bottom:8px}
.t{font-weight:600;cursor:pointer}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.tag{font-size:12px;border-radius:6px;padding:1px 7px;background:var(--bg);color:var(--mu);white-space:nowrap}
.b-red{background:var(--red2);color:var(--red)}.b-amb{background:var(--amb2);color:var(--amb)}.b-blu{background:var(--blu2);color:var(--blu)}.b-grn{background:var(--pri2);color:var(--pri)}.b-pur{background:var(--pur2);color:var(--pur)}
.meta{color:var(--mu);font-size:13px;margin-top:3px}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:12px 12px;font-size:15px;font-weight:600;flex:1;min-width:30%}
.btn.sm{padding:8px 10px;font-size:14px;flex:0 0 auto;min-width:0}
.ok{background:var(--pri);color:#fff}.gh{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}.rd{background:var(--red2);color:var(--red)}.am{background:var(--amb2);color:var(--amb)}
.box{margin-top:8px;border-top:1px dashed var(--bd);padding-top:7px;font-size:14px}
.box div{margin:3px 0}
.imgs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.imgs img{width:88px;height:88px;object-fit:cover;border-radius:8px;border:1px solid var(--bd)}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
#login{max-width:360px;margin:9vh auto;padding:22px}
input,select,textarea{width:100%;font:inherit;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);margin:4px 0 12px}
input[type=checkbox]{width:auto;margin:0 8px 0 0;transform:scale(1.3)}
label{font-size:13px;color:var(--mu)}
.ck{display:flex;align-items:center;font-size:15px;color:var(--tx);margin:4px 0 14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px 22px}
.sheet h4{margin:0 0 4px;font-size:17px}
.pv{position:relative}.pv b{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border-radius:50%;width:24px;height:24px;text-align:center;line-height:24px;font-size:14px}
.pick{display:flex;align-items:center;justify-content:center;width:88px;height:88px;border:2px dashed var(--bd);border-radius:8px;color:var(--mu);font-size:30px;margin:0}
table{width:100%;border-collapse:collapse;background:var(--card);font-size:13px}
th,td{padding:7px 5px;border-bottom:1px solid var(--bd);text-align:center}th:first-child,td:first-child{text-align:left}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:10px}
.big{font-size:28px;font-weight:700}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.grid3>div{background:var(--bg);border-radius:8px;padding:7px;text-align:center;font-size:13px}
.grid3 b{display:block;font-size:17px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:11px 16px;border-radius:10px;z-index:40;display:none;max-width:90%;text-align:center}
.spin{position:fixed;inset:0;background:rgba(255,255,255,.35);display:none;align-items:center;justify-content:center;z-index:30;font-weight:600}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;word-break:break-all;background:var(--bg);padding:8px;border-radius:8px}
.li{display:flex;gap:8px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--bd)}
.li:last-child{border-bottom:0}
.li .f{flex:1;min-width:0}
.del{color:var(--red);background:none;border:0;font-size:14px;padding:2px 4px}
.two{display:flex;gap:8px}.two>div{flex:1}
</style>
</head>
<body>
<div id="app"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<div class="spin" id="spin"><div class="card">Đang xử lý…</div></div>
<script src="config.js"></script>
<script>
/* ====== Kết nối máy chủ Apps Script (thay google.script.run) ====== */
var BOOT=(function(){var q=new URLSearchParams(location.search),c=function(k,re){return (q.get(k)||'').replace(re,'')};return {k:c('k',/[^\w\-]/g),ma:c('ma',/[^\w\-]/g),tab:c('tab',/[^\w]/g),nv:c('nv',/[^\w]/g)}})();
if(location.search&&!BOOT.nv){try{history.replaceState(null,'',location.pathname)}catch(e){}}
var google={script:{get run(){var s=null,f=null,o={withSuccessHandler:function(x){s=x;return o},withFailureHandler:function(x){f=x;return o},
  api:function(a,t,p){
    if(typeof API_URL==='undefined'||!/^https?:/.test(API_URL)&&API_URL.charAt(0)!=='/'){f&&f(new Error('Chưa điền link máy chủ trong config.js'));return}
    fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({a:a,t:t,p:p}),redirect:'follow'})
    .then(function(r){if(!r.ok)throw new Error('Máy chủ trả lỗi '+r.status);return r.json()}).then(function(r){s&&s(r)})
    .catch(function(e){f&&f(e)})}};return o}}};
/* ====== Thông báo đẩy OneSignal ====== */
var BASE=location.pathname.replace(/[^\/]*$/,'');
var PUSH={os:null,dangTai:false,loi:''};
function laIOS(){return /iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)}
function laApp(){return navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)}
function khoiTaoPush(appId,maNguoi){
  if(!appId||PUSH.dangTai)return;PUSH.dangTai=true;
  window.OneSignalDeferred=window.OneSignalDeferred||[];
  var sc=document.createElement('script');sc.src='https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js';sc.defer=true;
  sc.onerror=function(){PUSH.loi='Không tải được OneSignal (kiểm tra mạng)';veLaiPush()};document.head.appendChild(sc);
  OneSignalDeferred.push(function(OS){
    return OS.init({appId:appId,serviceWorkerPath:BASE.slice(1)+'sw.js',serviceWorkerParam:{scope:BASE},allowLocalhostAsSecureOrigin:true,autoResubscribe:true})
    .then(function(){PUSH.os=OS;try{OS.User.PushSubscription.addEventListener('change',veLaiPush);OS.Notifications.addEventListener('permissionChange',veLaiPush)}catch(e){}return OS.login(maNguoi)})
    .then(veLaiPush).catch(function(e){PUSH.loi=String(e&&e.message||e);veLaiPush()});
  });
}
function ttPush(){
  var os=PUSH.os,t={coAppId:!!(S.d&&S.d.push&&S.d.push.appId),ios:laIOS(),app:laApp(),hoTro:'Notification' in window&&'serviceWorker' in navigator,quyen:('Notification' in window)?Notification.permission:'default',bat:false};
  try{if(os){t.bat=!!os.User.PushSubscription.optedIn&&t.quyen==='granted'}}catch(e){}
  return t;
}
function veLaiPush(){var e=$('pushBox');if(e)e.innerHTML=htmlPush();var b=$('pushBanner');if(b)b.outerHTML=bannerPush()}
function batPush(){
  var os=PUSH.os;if(!os){toast(PUSH.loi||'Đang tải bộ thông báo, thử lại sau vài giây');return}
  os.Notifications.requestPermission().then(function(){return os.User.PushSubscription.optIn()}).then(function(){setTimeout(veLaiPush,600);setTimeout(veLaiPush,2500)})
  .catch(function(e){toast('Không bật được: '+(e&&e.message||e))});
}
</script>
<script>
/* ================= TIỆN ÍCH ================= */
var S={dangTai:0,lanTai:0,lv:'',tq:'',token:null,d:null,tab:'',thang:null,nam:null,loc:{nguoi:'',khu:'',dong:false},mo:{},sap:false,cd:null,cdTab:'tk',tk:null,tkNam:null,qViec:'',kvViec:'',nk:{}};
var F={};
var LS={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}},del:function(k){try{localStorage.removeItem(k)}catch(e){}}};
S.token=LS.get('mtcc_tk');
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(function(){t.style.display='none'},3500)}
function spin(on){$('spin').style.display=on?'flex':'none';if(!on)spinMsg()}
function call(action,p,cb,che,loi){ // che: true|'nen' = chạy ngầm (chỉ hiện ⟳ trên đầu trang); mặc định che màn hình
  var nen=che===true||che==='nen';
  if(nen){S.dangTai++;veSync()}else spin(true);
  google.script.run.withSuccessHandler(function(r){if(nen){S.dangTai--;veSync()}else spin(false);
    if(!r||!r.ok){if(r&&r.err==='HET_PHIEN'){hetPhien(function(){call(action,p,cb,che,loi)});return}toast((r&&r.err)||'Lỗi không xác định');if(loi)loi(r);return}
    cb(r)})
  .withFailureHandler(function(e){if(nen){S.dangTai--;veSync()}else spin(false);toast('Lỗi kết nối: '+(e&&e.message||e));if(loi)loi()}).api(action,S.token,p||{});
}
function veSync(){var e=$('sync');if(e)e.textContent=S.dangTai>0?'⟳ đang cập nhật':(S.lanTai?'✓ '+new Date(S.lanTai).toTimeString().slice(0,5):'')}
/* Ghi dữ liệu: cập nhật ngay trên màn hình, máy chủ ghi ở phía sau và trả luôn dữ liệu mới */
function ghi(action,p,o){
  o=o||{};p=p||{};p._data=1;
  if(o.lac&&p.ma){var x=timO(p.ma);if(x){o.lac(x);ve()}}
  if(o.dongForm)dong();
  if(o.msgTruoc)toast(o.msgTruoc);
  call(action,p,function(r){if(r.data)nhanDuLieu(r.data);else taiLai(null,true);if(o.msg)toast(o.msg);if(o.sau)o.sau(r)},o.chan?false:'nen',function(){taiLai(null,true)});
}
function spinMsg(m){$('spin').firstElementChild.textContent=m||'Đang xử lý…'}
function s2d(s){var a=s.split('-');return new Date(Date.UTC(+a[0],+a[1]-1,+a[2]))}
function add(s,n){var d=s2d(s);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function diff(a,b){return Math.round((s2d(a)-s2d(b))/864e5)}
var THU=['CN','T2','T3','T4','T5','T6','T7'];
function nn(s){return s?THU[s2d(s).getUTCDay()]+' '+s.slice(8,10)+'/'+s.slice(5,7):''}
function tg(s){return s?s.slice(8,10)+'/'+s.slice(5,7)+' '+s.slice(11,16):''}
function tenUser(t){var u=(S.d.users||[]).filter(function(x){return x.tenDN===t})[0];return u?u.hoTen:t}
function laTBP(){return S.d&&S.d.user.vaiTro==='TBP'}
function toTruong(){return S.d.users.filter(function(u){return u.vaiTro==='TO_TRUONG'})}
function hoi(msg,cb){moForm('<h4>Xác nhận</h4><div style="margin:8px 0 4px">'+esc(msg)+'</div><div class="acts"><button class="btn gh" data-a="dong">Không</button><button class="btn ok" data-a="hoiOk">Đồng ý</button></div>');F._hoi=cb}
function moForm(h){$('sheet').innerHTML=h;$('modal').classList.add('on');$('sheet').scrollTop=0}
function dong(){$('modal').classList.remove('on');$('sheet').innerHTML='';F={}}
$('modal').addEventListener('click',function(e){if(e.target===this)dong()});
function val(id){var e=$(id);return e?e.value:''}

/* ================= ĐĂNG NHẬP (ghi nhớ mật khẩu trên máy) ================= */
function manDangNhap(msg){
  var u=LS.get('mtcc_u')||'',p='',nho=LS.get('mtcc_nho')!=='0';
  try{p=LS.get('mtcc_p')?decodeURIComponent(escape(atob(LS.get('mtcc_p')))):''}catch(e){}
  $('app').innerHTML='<div id="login" class="card"><h2 style="margin:0 0 2px">🧹 Đánh giá tổ trưởng</h2><div class="meta" style="margin-bottom:16px">Bộ phận Môi trường công cộng</div>'+
  (msg?'<div class="tag b-amb" style="display:block;margin-bottom:10px;white-space:normal">'+esc(msg)+'</div>':'')+
  '<form id="fLogin" autocomplete="on"><label>Tên đăng nhập</label><input id="lu" name="username" autocapitalize="off" autocomplete="username" value="'+esc(u)+'">'+
  '<label>Mật khẩu</label><div style="position:relative"><input id="lp" name="password" type="password" autocomplete="current-password" value="'+esc(p)+'" style="padding-right:48px">'+
  '<button type="button" data-a="hienMK" style="position:absolute;right:6px;top:10px;border:0;background:none;font-size:20px">👁</button></div>'+
  '<label class="ck"><input type="checkbox" id="lnho" '+(nho?'checked':'')+'>Ghi nhớ mật khẩu trên máy này</label>'+
  '<button class="btn ok" style="width:100%" type="submit">Đăng nhập</button></form></div>';
  $('fLogin').onsubmit=function(e){e.preventDefault();dangNhap()};
}
function luuMK(u,p,nho){
  LS.set('mtcc_nho',nho?'1':'0');LS.set('mtcc_u',u);
  if(nho)LS.set('mtcc_p',btoa(unescape(encodeURIComponent(p))));else LS.del('mtcc_p');
}
function dangNhap(){
  var u=val('lu').trim(),p=val('lp'),nho=$('lnho').checked;
  if(!u||!p)return toast('Nhập tên đăng nhập và mật khẩu');
  call('login',{user:u,pass:p},function(r){if(LS.get('mtcc_u')!==u)LS.del('mtcc_d');luuMK(u,p,nho);vaoApp(r.token)});
}
function vaoApp(tk,cb){var c=docD();S.token=tk;LS.set('mtcc_tk',tk);LS.del('mtcc_noauto');taiLai(cb)}
function dangNhapLuu(cb,loi){
  var u=LS.get('mtcc_u'),p='';
  try{p=LS.get('mtcc_p')?decodeURIComponent(escape(atob(LS.get('mtcc_p')))):''}catch(e){}
  if(!u||!p||LS.get('mtcc_noauto')){manDangNhap(loi);return}
  google.script.run.withSuccessHandler(function(r){if(r&&r.ok){S.token=r.token;LS.set('mtcc_tk',r.token);cb()}else manDangNhap(r&&r.err==='Sai tên đăng nhập hoặc mật khẩu'?'Mật khẩu đã được thay đổi, vui lòng nhập lại':loi)})
    .withFailureHandler(function(){manDangNhap('Lỗi kết nối')}).api('login',null,{user:u,pass:p});
}
function hetPhien(cb){S.token=null;LS.del('mtcc_tk');dangNhapLuu(cb,'Phiên đăng nhập đã hết, vui lòng đăng nhập lại')}
function dangXuat(){
  hoi('Thoát khỏi app?',function(){
    if(S.token)google.script.run.api('logout',S.token,{});
    try{if(PUSH.os)PUSH.os.logout()}catch(e){}
    S.token=null;S.d=null;S.tab='';LS.del('mtcc_tk');LS.del('mtcc_d');LS.set('mtcc_noauto','1');manDangNhap();
  });
}
function luuD(){try{if(S.d)localStorage.setItem('mtcc_d',JSON.stringify(S.d))}catch(e){}}
function docD(){try{var x=JSON.parse(localStorage.getItem('mtcc_d')||'null');return x&&x.user?x:null}catch(e){return null}}
function nhanDuLieu(r){
  var dau=!S.d;S.d=r;S.lanTai=Date.now();luuD();
  if(!S.tab||!dsTab().some(function(t){return t[0]===S.tab}))S.tab=laTBP()?'tq':'viec';if(!S.thang)S.thang=r.today.slice(0,7);
  ve();
  if(r.push&&r.push.appId){if(PUSH.os){try{PUSH.os.login(r.push.maNguoi)}catch(e){}}else khoiTaoPush(r.push.appId,r.push.maNguoi)}
}
function taiLai(cb,nen){
  if(!nen&&!S.d){var c=docD();if(c){S.d=c;if(!S.tab)S.tab=c.user.vaiTro==='TBP'?'tq':'viec';if(!S.thang)S.thang=c.today.slice(0,7);ve();nen=true}}
  call('data',{},function(r){nhanDuLieu(r);if(cb)cb()},nen?'nen':false);
}
/* ================= KHUNG ================= */
function demViec(){
  var me=S.d.user.tenDN,T=S.d.today,c={qh:0,nhan:0,lam:0,xn:0,cd:0,sap:0};
  S.d.ds.forEach(function(o){if(!o.mo||(!laTBP()&&o.phuTrach!==me))return;

function nenAnh(file,nhan,cb){ // ảnh lớn ≤1024px (JPEG .7) + ảnh nhỏ 360px cho báo cáo; in giờ + nội dung ở cạnh dưới
  var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){
    var m=1024,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    var g=c.getContext('2d');g.drawImage(im,0,0,c.width,c.height);
    var now=new Date(),p=function(n){return (n<10?'0':'')+n},fs=Math.max(14,Math.round(c.width/38));
    var dong=[p(now.getDate())+'/'+p(now.getMonth()+1)+'/'+now.getFullYear()+' '+p(now.getHours())+':'+p(now.getMinutes())].concat(nhan||[]);
    var hb=dong.length*fs*1.35+fs*.6;g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,c.height-hb,c.width,hb);
    g.fillStyle='#fff';g.font='600 '+fs+'px -apple-system,Segoe UI,Roboto,Arial';g.textBaseline='top';
    dong.forEach(function(t,i){g.fillText(String(t).slice(0,70),fs*.6,c.height-hb+fs*.3+i*fs*1.35)});
    var lon=c.toDataURL('image/jpeg',0.7),k2=Math.min(1,360/Math.max(c.width,c.height)),c2=document.createElement('canvas');
    c2.width=Math.round(c.width*k2);c2.height=Math.round(c.height*k2);c2.getContext('2d').drawImage(c,0,0,c2.width,c2.height);
    cb({lon:lon,nho:c2.toDataURL('image/jpeg',0.6)})};im.onerror=function(){cb(null)};im.src=fr.result};fr.readAsDataURL(file);
}

/* ================= KHỞI ĐỘNG ================= */
function moTuLink(){
  var b=(typeof BOOT==='object'&&BOOT)||{};
  var tabMap={duyet:'tq'};if(b.tab)b.tab=tabMap[b.tab]||b.tab;
  if(b.tab&&dsTab().some(function(t){return t[0]===b.tab})){S.tab=b.tab;ve()}
  if(!b.ma)return;
  var o=timO(b.ma);
  if(!o){toast('Không tìm thấy việc – có thể đã đóng');return}
  if(!laTBP()){S.tab=o.mo?'viec':'xong';S.lv=''}
  else if(o.tt==='CHO_DUYET'||o.tt==='HOAN_THANH'&&o.hoanThanhLuc.slice(0,10)>=add(S.d.today,-7)){S.tab='tq';S.tq=''}
  else{S.tab='viec';S.loc.dong=!o.mo;S.loc.nguoi='';S.loc.khu=''}
  S.mo[o.ma]=true;if(o.ngayBao>S.d.today)S.sap=true;ve();
  setTimeout(function(){var c=$('c_'+o.ma);if(c){c.scrollIntoView({block:'center'});c.style.outline='2px solid var(--pri)'}},60);
}

var NV={info:null,ten:''};
function moTrangNV(tok){
  $('app').innerHTML='<header><b>📷 Gửi ảnh hoàn thành</b></header><main><div class="empty">Đang tải…</div></main>';
  F={anh:[],nho:[]};
  call('nvXem',{tok:tok},function(r){NV.info=r;NV.tok=tok;veNV()},false,function(r){$('app').innerHTML='<header><b>📷 Gửi ảnh hoàn thành</b></header><main><div class="card"><b>'+esc(r&&r.err||'Không mở được link')+'</b></div></main>'});
}
function veNV(){
  var r=NV.info,n=diff(r.han,r.today);F.nhanAnh=[r.khuVuc+' · '+r.ten,NV.ten||''];
  var h='<header><b>📷 Gửi ảnh hoàn thành</b></header><main><div class="card"><div class="meta">'+esc(r.khuVuc)+(r.phuTrach?' · Tổ trưởng: '+esc(r.phuTrach):'')+'</div><div class="ttl">'+esc(r.ten)+'</div>'+
    '<span class="han '+(n<0?'r':n<=1?'a':'b')+'">'+(n<0?'Đã quá hạn '+(-n)+' ngày':n===0?'Hạn hôm nay':'Hạn '+nn(r.han))+'</span>'+(r.viTri?'<div class="meta">📍 '+esc(r.viTri)+'</div>':'')+(r.moTa?'<div class="meta">📝 '+esc(r.moTa)+'</div>':'')+'</div>';
  if(r.daGui)h+='<div class="nvbox">Đã có <b>'+r.daGui.so+'</b> ảnh của '+esc(r.daGui.ten)+' gửi lúc '+tg(r.daGui.luc)+' – đang chờ tổ trưởng xác nhận. Có thể gửi thêm nếu cần.</div>';
  h+='<div class="card"><label>Tên của bạn *</label><div class="chips wrap">'+r.nhanVien.map(function(t){return '<button class="chip '+(NV.ten===t?'on':'')+'" data-a="nvTen" data-v="'+esc(t)+'">'+esc(t)+'</button>'}).join('')+'<button class="chip '+(NV.khac?'on':'')+'" data-a="nvTen" data-v="">Tên khác…</button></div>'+
    (NV.khac||!r.nhanVien.length?'<input id="f_nvten" placeholder="Nhập họ tên" value="'+esc(NV.khac?NV.ten:'')+'">':'')+
    '<label>Ảnh sau khi làm xong * – bấm 📷 để chụp (ảnh tự in giờ chụp)</label><div class="imgs" id="f_anh"></div>'+
    '<label style="display:block;margin-top:10px">Ghi chú (không bắt buộc)</label><textarea id="f_gc" rows="2"></textarea>'+
    '<button class="btn ok" style="width:100%;margin-top:6px" data-a="nvGui">📤 Gửi ảnh</button></div></main>';
  $('app').innerHTML=h;veAnh(r.soAnh);
  var ip=$('f_nvten');if(ip)ip.oninput=function(){NV.ten=this.value.trim();F.nhanAnh=[r.khuVuc+' · '+r.ten,NV.ten]};
}
A.nvTen=function(d){var ip=$('f_nvten');if(d.v){NV.ten=d.v;NV.khac=false}else{NV.khac=true;NV.ten=ip?ip.value.trim():''}var a=F.anh,nh=F.nho;veNV();F.anh=a;F.nho=nh;veAnh(NV.info.soAnh)};
A.nvGui=function(){var ip=$('f_nvten');if(ip)NV.ten=ip.value.trim();if(!NV.ten)return toast('Chọn hoặc nhập tên của bạn');if(!F.anh.length)return toast('Bấm 📷 để chụp ít nhất 1 ảnh');
